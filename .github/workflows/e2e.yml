name: E2E

# Manual: requer um banco Neon acessivel com schema/RLS ja aplicados
# (mesmo setup do ambiente local). Configure os secrets:
#   E2E_DATABASE_URL, E2E_DATABASE_AUTHENTICATED_URL, E2E_BETTER_AUTH_SECRET
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_AUTHENTICATED_URL: ${{ secrets.E2E_DATABASE_AUTHENTICATED_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: glowhub.app
      DEFAULT_TENANT_SLUG: demo
      NEXT_PUBLIC_DEMO_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Seed demo data
        run: node scripts/seed-demo.mjs
      - name: E2E
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
